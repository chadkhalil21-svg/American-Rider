<meta charset="utf-8">
<title>American Rider</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --ink:#14171F; --ink2:#3A3F49; --muted:#8A8A82; --faint:#B4B3AB;
    --blue:#2E5FE0; --blue-t:#F0F3FC; --blue-b:#E1E9FB; --green:#1F8A5B; --green-t:#E9F3EE; --red:#B3432E; --red-b:#E6C4BC;
    --bg:#F7F7F5; --canvas:#E7E6E1; --card:#FFFFFF; --line:#ECEBE6; --line2:#E3E2DC; --fill:#EFEEE9;
    --solid:#14171F; --solid-fg:#fff; /* strong surfaces (buttons) — stay legible in both themes */
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --ink:#F3F3F1; --ink2:#C3C6CC; --muted:#8B8E96; --faint:#65686F;
    --blue:#5C86F6; --blue-t:#1A2131; --blue-b:#2B3651; --green:#41BE82; --green-t:#15271D; --red:#E0674F; --red-b:#4A2A24;
    --bg:#14171F; --canvas:#0B0D12; --card:#1B1F27; --line:#2A2E38; --line2:#343945; --fill:#232732;
    --solid:#EDEDEB; --solid-fg:#14171F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--canvas); font-family:var(--sans); color:var(--ink); display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  #phone{ position:relative; width:100%; max-width:412px; height:100%; max-height:892px; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:480px) and (min-height:720px){ #phone{ border-radius:44px; box-shadow:0 30px 80px rgba(20,23,31,.26), 0 0 0 11px #14161c, 0 0 0 13px #23262e; height:844px; } }
  #screen{ flex:1; position:relative; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .pad{ padding:58px 24px 40px; min-height:100%; display:flex; flex-direction:column; }
  @media (min-width:480px) and (min-height:720px){ .pad{ padding-top:40px; } }

  .wm{ font-size:12px; font-weight:600; letter-spacing:.26em; color:var(--ink); text-align:center; }
  .wm .n{ display:block; font-size:7.5px; letter-spacing:.34em; color:var(--faint); font-weight:600; margin-top:2px; }
  .wm .op{ color:var(--blue); }
  .display{ font-size:31px; font-weight:600; letter-spacing:-.02em; line-height:1.14; }
  .title{ font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .sub{ font-size:14.5px; color:var(--muted); margin:9px 0 0; line-height:1.5; }
  .lbl{ font-size:11px; font-weight:600; letter-spacing:.15em; color:var(--muted); text-transform:uppercase; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .row{ display:flex; justify-content:space-between; align-items:center; }
  .spring{ flex:1; }
  .back{ background:none; border:0; padding:6px 0; text-align:left; font-size:15px; color:var(--blue); cursor:pointer; font-family:inherit; align-self:flex-start; font-weight:500; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .hair{ border-top:1px solid var(--line); }
  .fieldwrap{ border-bottom:1px solid var(--line); }
  .fieldwrap .l{ font-size:11px; color:var(--muted); margin-top:14px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
  .field{ width:100%; border:0; outline:none; background:transparent; font-size:16px; color:var(--ink); padding:12px 0; font-family:inherit; }

  button{ font-family:inherit; }
  .btn{ display:block; width:100%; border:0; border-radius:13px; padding:18px; text-align:center; font-size:16px; font-weight:600; letter-spacing:.01em; color:var(--solid-fg); background:var(--solid); cursor:pointer; transition:opacity .2s ease; }
  .btn:active{ opacity:.86; }
  .btn:disabled{ background:#DEDDD7; color:#A9A89F; }
  .btn.green{ background:var(--green); } .btn.blue{ background:var(--blue); }
  .btn.ghost{ background:var(--card); border:1px solid var(--line2); color:var(--ink); }
  .link{ color:var(--blue); cursor:pointer; font-weight:500; }
  .cta-space{ margin-top:24px; }
  .chev{ color:var(--faint); font-size:20px; }

  .codein{ display:block; width:100%; margin-top:24px; border:1px solid var(--line2); border-radius:13px; background:#fff; text-align:center; font-family:var(--mono); font-size:28px; font-weight:600; letter-spacing:.4em; padding:16px 10px 16px 24px; outline:none; color:var(--ink); }
  .codein:focus{ border-color:var(--blue); }

  .stepbar{ flex:1; height:3px; border-radius:2px; }
  .badge-ok{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--green); background:var(--green-t); border-radius:999px; padding:5px 12px; }
  .pill-rev{ font-size:12px; font-weight:600; color:var(--blue); }
  .pill-todo{ font-size:12.5px; font-weight:600; color:var(--muted); }

  .appview{ position:absolute; inset:0; }
  .appview iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .floatbar{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; }
  .toggle{ display:inline-flex; background:rgba(255,255,255,.96); backdrop-filter:blur(6px); border:1px solid var(--line2); border-radius:999px; padding:3px; box-shadow:0 4px 14px rgba(20,23,31,.14); }
  .toggle div{ padding:8px 20px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:background .2s,color .2s; }
  .toggle div.on{ background:var(--ink); color:#fff; }
  .finishpill{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; background:var(--solid); color:var(--solid-fg); border-radius:999px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(20,23,31,.2); }

  @keyframes fadein{ from{ opacity:0; transform:translateY(7px);} to{ opacity:1; transform:translateY(0);} }
  #screen.fx{ animation:fadein .3s cubic-bezier(.2,.6,.2,1); }
  @media (prefers-reduced-motion:reduce){ #screen.fx{ animation:none; } }

  function readTheme(){ var s=null; try{ s=localStorage.getItem('ar-theme'); }catch(e){} document.documentElement.setAttribute('data-theme',(s==='dark')?'dark':'light'); }
  readTheme();
  window.addEventListener('storage',function(e){ if(e.key==='ar-theme') readTheme(); });

  function has(r){ return S.roles.indexOf(r)>=0; }
  function both(){ return has('traveler')&&has('operator'); }
  function go(s){ S.screen=s; render(); }
  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }
  function validPhone(v){ return (v||'').replace(/\D/g,'').length>=10; }
  function signupOk(){ return S.name.trim().length>0 && validEmail(S.email) && validPhone(S.phone); }
  function codeOk(){ return S.code.replace(/\D/g,'').length===6; }
  function verifyDoc(k){ if(S.docs[k]==='ok'||S.docs[k]==='checking')return; S.docs[k]='checking'; render(); setTimeout(function(){ S.docs[k]='ok'; if(S.screen==='qualification')render(); },900); }
  function allVerified(){ return DOCS.every(function(d){ return S.docs[d[0]]==='ok'; }); }
  function verifiedCount(){ return DOCS.filter(function(d){ return S.docs[d[0]]==='ok'; }).length; }
  function firstName(){ return S.name?esc(S.name.trim().split(' ')[0]):''; }

  function cb(k,glyph){ return '<button class="btn ghost" data-act="social" style="display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500"><span style="display:inline-flex">'+glyph+'</span>Continue with '+k+'</button>'; }
  function welcome(){
    var apple='<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M16.4 12.9c0-2 1.6-2.9 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6 1.1 0 1.5.6 2.5.6s1.7-.9 2.3-1.9c.7-1 1-2 1-2-.1 0-2-.7-2-2.9zM14.6 6.2c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg>';
    var google='<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6c-.2 1.3-1 2.4-2 3.1v2.6h3.3c1.9-1.8 3.1-4.4 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.3-2.6c-.9.6-2 1-3.3 1-2.5 0-4.7-1.7-5.4-4H3.2v2.6C4.9 19.9 8.2 22 12 22z"/><path fill="#FBBC05" d="M6.6 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.2C2.4 8.8 2 10.4 2 12s.4 3.2 1.2 4.6z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.9 14.7 2 12 2 8.2 2 4.9 4.1 3.2 7.4L6.6 10c.7-2.3 2.9-4 5.4-4z"/></svg>';
    var mail='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '<div class="pad" style="text-align:center"><div class="spring"></div>'
      +'<div class="ar-mark" role="img" aria-label="American Rider" style="align-self:center"></div>'
      +'<div class="wm" style="margin-top:18px;font-size:14px;letter-spacing:.28em">AMERICAN RIDER</div>'
      +'<div style="font-size:11px;letter-spacing:.32em;color:var(--faint);font-weight:600;margin-top:6px">NATIONAL TRANSPORTATION</div>'
      +'<div class="spring"></div>'
      +'<div class="sub" style="font-size:15px;color:var(--muted);font-weight:400;letter-spacing:.02em">Safe. Reliable. American.</div>'
      +'<div class="spring"></div>'
      +'<button class="btn" data-act="go" data-s="signup">Create Account</button>'
      +'<button class="btn ghost" data-act="go" data-s="signin" style="margin-top:11px">Sign In</button>'
      +'<div class="row" style="margin:22px 4px 0;gap:12px"><span class="hair" style="flex:1"></span><span style="font-size:11px;color:var(--faint);letter-spacing:.1em">OR</span><span class="hair" style="flex:1"></span></div>'
      +'<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">'+cb('Apple',apple)+cb('Google',google)+cb('Email',mail)+'</div>'
      +'<div style="font-size:11px;color:var(--faint);margin-top:22px;line-height:1.5">By continuing you accept the Terms of Service and Privacy Policy.</div></div>';
  }
  function signin(){
    var ok=validEmail(S.email)&&(S.pass||'').length>=4;
    return '<div class="pad"><button class="back" data-act="go" data-s="welcome">‹ Back</button>'
      +'<div class="title" style="margin-top:8px">Welcome back</div><div class="sub">Sign in to your account.</div>'
      +'<div class="card" style="margin-top:20px;padding:2px 20px"><div class="fieldwrap"><div class="l">Email</div><input class="field" id="f-e" data-k="email" value="'+esc(S.email)+'" placeholder="you@email.com" inputmode="email"></div>'
      +'<div class="fieldwrap" style="border-bottom:0"><div class="l">Password</div><input class="field" id="f-p" data-k="pass" type="password" value="'+esc(S.pass||'')+'" placeholder="Your password"></div></div>'
      +'<div class="link" style="font-size:13px;margin-top:12px;color:var(--muted)">Forgot password?</div>'
      +'<div class="spring"></div><button class="btn" data-act="dosignin" '+(ok?'':'disabled')+'>Sign In</button>'
      +'<div class="link" data-act="go" data-s="signup" style="text-align:center;margin-top:16px">New here? Create an account</div></div>';
  }
  function signup(){
    var ok=signupOk();
    return '<div class="pad"><button class="back" data-act="go" data-s="welcome">‹ Back</button>'
      +'<div class="title" style="margin-top:8px">Create your account</div><div class="sub">The same first step for travelers and operators.</div>'
      +'<div class="card" style="margin-top:20px;padding:2px 20px"><div class="fieldwrap"><div class="l">Full Name</div><input class="field" id="f-n" data-k="name" value="'+esc(S.name)+'" placeholder="J. Reyes"></div>'
      +'<div class="fieldwrap"><div class="l">Email</div><input class="field" id="f-e" data-k="email" value="'+esc(S.email)+'" placeholder="you@email.com" inputmode="email"></div>'
      +'<div class="fieldwrap" style="border-bottom:0"><div class="l">Mobile Number</div><input class="field" id="f-ph" data-k="phone" value="'+esc(S.phone)+'" placeholder="(305) 555-4417" inputmode="tel"></div></div>'
      +'<div style="font-size:12.5px;color:var(--muted);margin-top:12px">A verification code will be sent by text.</div>'
      +'<div class="spring"></div><button class="btn" data-act="tocode" '+(ok?'':'disabled')+'>Continue</button></div>';
  }
  function confirm(){
    return '<div class="pad"><button class="back" data-act="go" data-s="signup">‹ Back</button>'
      +'<div class="title" style="margin-top:8px">Confirm your number</div><div class="sub">A 6-digit code was sent to '+(S.phone||'your phone')+'.</div>'
      +'<input id="f-code" data-k="code" class="codein" inputmode="numeric" maxlength="6" placeholder="••••••" value="'+esc(S.code)+'" autocomplete="one-time-code">'
      +'<div style="text-align:center;font-size:12px;color:var(--faint);margin-top:12px">Demo — enter any 6 digits.</div>'
      +'<div class="link" data-act="resend" style="text-align:center;margin-top:8px;color:'+(S.codeSent?'var(--green)':'var(--blue)')+'">'+(S.codeSent?'New code sent':'Resend code')+'</div>'
      +'<div class="spring"></div><button class="btn" data-act="submitcode" '+(codeOk()?'':'disabled')+'>Confirm</button></div>';
  }
  function selectAccount(){
    return '<div class="pad"><div class="title" style="margin-top:8px">Select Account</div><div class="sub">Choose where to begin. You can add the other role at any time.</div>'
      +'<div class="card" data-act="picktraveler" style="margin-top:22px;padding:22px;cursor:pointer"><div class="row"><div><div style="font-size:19px;font-weight:600">Traveler</div><div style="font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5">Reserve travel in a few steps. Set-up takes a minute.</div></div><span class="chev">›</span></div></div>'
      +'<div class="card" data-act="pickoperator" style="margin-top:14px;padding:22px;cursor:pointer"><div class="row"><div><div style="font-size:19px;font-weight:600">Operator</div><div style="font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5">Operate and retain 99% of every fare. A brief qualification is required.</div></div><span class="chev">›</span></div></div>'
      +'<div class="spring"></div><div class="link" data-act="picktraveler" style="text-align:center;padding:10px">Not sure yet — begin as a Traveler</div></div>';
  }
  function travelerDone(){
    return '<div class="pad" style="text-align:center"><div class="spring"></div>'
      +'<svg width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#1F8A5B" stroke-width="2" style="margin:0 auto"><circle cx="30" cy="30" r="22"/><path d="M21 30l6 6 12-13" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      +'<div class="title" style="margin-top:18px">Your account is ready'+(firstName()?', '+firstName():'')+'</div>'
      +'<div class="sub" style="text-align:center">Payment can be added when you reserve your first travel.</div>'
      +'<div class="spring"></div><button class="btn" data-act="enterTraveler">Begin Travel</button></div>';
  }
  function qualification(){
    var done=allVerified(), n=verifiedCount();
    var h='<div class="pad"><button class="back" data-act="'+(S.upgrading?'enterTraveler':'go')+'"'+(S.upgrading?'':' data-s="selectAccount"')+'>‹ '+(S.upgrading?'Not now':'Back')+'</button>';
    h+='<div class="wm" style="margin-top:8px;text-align:left">AMERICAN RIDER <span class="op">· OPERATOR</span></div>';
    h+='<div class="title" style="margin-top:8px">Operator Qualification</div>';
    h+='<div class="sub">'+n+' of '+DOCS.length+' verified · complete in any order. Your progress is saved.</div>';
    h+='<div style="display:flex;gap:5px;margin-top:16px">';
    DOCS.forEach(function(d){ h+='<div class="stepbar" style="background:'+(S.docs[d[0]]==='ok'?'var(--green)':'var(--line2)')+'"></div>'; });
    h+='</div>';
    h+='<div style="margin-top:16px;background:var(--blue-t);border:1px solid var(--blue-b);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--ink2);line-height:1.45">You retain 99% of every fare once commissioned.</div>';
    h+='<div class="card" style="margin-top:16px;padding:2px 20px">';
    DOCS.forEach(function(d,i){
      var st=S.docs[d[0]];
      var right = st==='ok'?'<span class="badge-ok">✓ Verified</span>':st==='checking'?'<span class="pill-rev">Checking…</span>':'<span class="pill-todo">Add ›</span>';
      h+='<div class="row'+(i>0?' hair':'')+'" data-act="verifydoc" data-k="'+d[0]+'" style="padding:15px 0;cursor:pointer"><div><div style="font-size:15px">'+d[1]+'</div>'+(d[2]?'<div style="font-size:12.5px;color:var(--muted);margin-top:2px">'+d[2]+'</div>':'')+'</div>'+right+'</div>';
    });
    h+='</div>';
    h+='<div style="font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.45">American Rider verifies commercial coverage but does not sell it. Estimates only — not financial advice.</div>';
    h+='<div class="spring"></div><button class="btn cta-space" data-act="submitqual" '+(done?'':'disabled')+'>'+(done?'Submit for Review':'Verify all '+DOCS.length+' to continue')+'</button></div>';
    return h;
  }
  function review(){
    return '<div class="pad" style="text-align:center"><div class="spring"></div>'
      +'<svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#2E5FE0" stroke-width="1.8" style="margin:0 auto"><path d="M28 6l18 7v11c0 12-8 20-18 26C18 44 10 36 10 24V13z" stroke-linejoin="round"/></svg>'
      +'<div class="title" style="margin-top:18px">Under Review</div>'
      +'<div class="sub" style="text-align:center">Your qualification is complete. Most operators are commissioned within a few hours — you will be notified the moment you are cleared.</div>'
      +'<div class="spring"></div><button class="btn green" data-act="commission">Continue</button>'
      +'<div class="link" data-act="peekTraveler" style="text-align:center;margin-top:16px">Travel as a Traveler while you wait</div></div>';
  }
  function commissioned(){
    return '<div class="pad" style="text-align:center"><div class="spring"></div>'
      +'<svg width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#1F8A5B" stroke-width="2" style="margin:0 auto"><circle cx="30" cy="30" r="22"/><path d="M21 30l6 6 12-13" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      +'<div style="margin-top:16px"><span class="badge-ok" style="font-size:12.5px;padding:6px 14px">✓ Operator Commissioned</span></div>'
      +'<div class="title" style="margin-top:14px">You are commissioned'+(firstName()?', '+firstName():'')+'</div>'
      +'<div class="sub" style="text-align:center">You hold both roles — switch back to your Traveler view anytime from the menu.</div>'
      +'<div class="spring"></div><button class="btn green" data-act="enterOperator">Enter Dashboard</button></div>';
  }

  function appView(){
    var qn='?n='+encodeURIComponent(S.name||''); // carry the signed-up name into both apps
    var h='<div class="appview"><iframe id="tFrame" src="traveler-institutional.html'+qn+'" title="Traveler"'+(S.activeMode==='traveler'?'':' style="display:none"')+'></iframe>';
    if(has('operator')) h+='<iframe id="oFrame" src="operator-institutional.html'+qn+'" title="Operator"'+(S.activeMode==='operator'?'':' style="display:none"')+'></iframe>';
    // No top role toggle by design — switching roles lives inside each app's hamburger menu.
    if(S.verification==='pending' && S.activeMode==='traveler'){
      h+='<div class="finishpill" data-act="backToReview">Finish operator qualification ›</div>';
    }
    return h+'</div>';
  }
  function showMode(m){
    var tf=document.getElementById('tFrame'), of=document.getElementById('oFrame');
    if(tf)tf.style.display=(m==='traveler')?'':'none';
    if(of)of.style.display=(m==='operator')?'':'none';
    var tg=document.querySelectorAll('.toggle div'); for(var i=0;i<tg.length;i++){ tg[i].className=(tg[i].getAttribute('data-m')===m)?'on':''; }
  }

  var SCREENS={ welcome:welcome, signin:signin, signup:signup, confirm:confirm, selectAccount:selectAccount, travelerDone:travelerDone, qualification:qualification, review:review, commissioned:commissioned, app:appView };
  function render(){
    var el=document.getElementById('screen');
    var f=document.activeElement, fid=f&&f.id, fp=f&&f.selectionStart;
    el.className=''; el.innerHTML=(SCREENS[S.screen]||welcome)(); void el.offsetWidth; el.className='fx';
    if(fid){ var n=document.getElementById(fid); if(n){ n.focus(); try{n.setSelectionRange(fp,fp);}catch(e){} } } else el.scrollTop=0;
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t)return; var a=t.getAttribute('data-act');
    var A={
      go:function(){ go(t.getAttribute('data-s')); },
      social:function(){ if(!has('traveler'))S.roles.push('traveler'); S.activeMode='traveler'; if(!S.name)S.name='Traveler'; go('app'); },
      dosignin:function(){ if(!(validEmail(S.email)&&(S.pass||'').length>=4))return; if(!has('traveler'))S.roles.push('traveler'); if(!has('operator'))S.roles.push('operator'); S.verification='commissioned'; S.activeMode='traveler'; if(!S.name)S.name=S.email.split('@')[0]; go('app'); }, // demo sign-in = a both-roles account so the headline toggle shows instantly
      tocode:function(){ if(!signupOk())return; S.code=''; S.codeSent=false; go('confirm'); },
      resend:function(){ S.codeSent=true; render(); },
      submitcode:function(){ if(codeOk()) go('selectAccount'); },
      picktraveler:function(){ if(!has('traveler'))S.roles.push('traveler'); S.activeMode='traveler'; go('travelerDone'); },
      pickoperator:function(){ S.upgrading=false; if(!has('traveler'))S.roles.push('traveler'); go('qualification'); },
      verifydoc:function(){ verifyDoc(t.getAttribute('data-k')); },
      submitqual:function(){ if(allVerified()){ S.verification='pending'; go('review'); } },
      commission:function(){ S.verification='commissioned'; if(!has('operator'))S.roles.push('operator'); S.activeMode='operator'; go('commissioned'); },
      peekTraveler:function(){ S.verification='pending'; if(!has('traveler'))S.roles.push('traveler'); S.activeMode='traveler'; go('app'); },
      backToReview:function(){ go('review'); },
      enterTraveler:function(){ if(!has('traveler'))S.roles.push('traveler'); S.activeMode='traveler'; go('app'); },
      enterOperator:function(){ S.activeMode='operator'; go('app'); },
      'switch':function(){ var m=t.getAttribute('data-m'); if(!m||!both()||m===S.activeMode)return; S.activeMode=m; showMode(m); }
    };
    if(A[a]){ e.preventDefault(); A[a](); }
  });
  document.addEventListener('input',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-k'); if(!k)return; S[k]=e.target.value;
    var pad=e.target.closest('.pad'); if(!pad)return;
    var toc=pad.querySelector('[data-act="tocode"]'); if(toc)toc.disabled=!signupOk();
    var si=pad.querySelector('[data-act="dosignin"]'); if(si)si.disabled=!(validEmail(S.email)&&(S.pass||'').length>=4);
    var sc=pad.querySelector('[data-act="submitcode"]'); if(sc)sc.disabled=!codeOk();
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return; var pad=e.target.closest&&e.target.closest('.pad'); if(!pad)return;
    var b=pad.querySelector('[data-act="tocode"]:not([disabled]),[data-act="dosignin"]:not([disabled]),[data-act="submitcode"]:not([disabled])');
    if(b){ e.preventDefault(); b.click(); }
  });
  // Traveler app posts this when a traveler taps "Begin Operator Qualification"
  window.addEventListener('message',function(e){
    if(!e)return;
    if(e.data==='ar:becomeOperator'){
      if(has('traveler')&&!has('operator')){ S.upgrading=true; go('qualification'); }
      else if(both()){ S.activeMode='operator'; showMode('operator'); }
    } else if(e.data==='ar:switchTraveler'){
      if(both()){ S.activeMode='traveler'; showMode('traveler'); }
    }
  });

  render();
})();
</script>
