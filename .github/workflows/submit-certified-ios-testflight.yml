name: Build and submit certified iOS candidate to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-submit-certified-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_KEY_ID: LS74L322NV
      ASC_ISSUER_ID: 2fa282d5-2b2c-4820-8fe9-6928ac1e8d33
      CERTIFIED_SHA: 7c92654811df52dde471fb1abf157ff945ba7767

    steps:
      - name: Check out certified candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require submission credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is not configured."; exit 1; }
          test -n "$ASC_API_KEY_BASE64" || { echo "::error::ASC_API_KEY_BASE64 is not configured."; exit 1; }

      - name: Verify certified source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CERTIFIED_SHA" || { echo "::error::Refusing build: $ACTUAL_SHA != $CERTIFIED_SHA"; exit 1; }
          echo "Certified source verified: $ACTUAL_SHA"

      - name: Advance remote iOS build number
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:version:set --platform ios --profile production --non-interactive

      - name: Build exact certified iOS candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait

      - name: Configure owner-controlled App Store Connect key for submission
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          node - "$KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'NODE'
          const fs = require('fs');
          const [keyPath, keyId, issuerId] = process.argv.slice(2);
          const p = 'eas.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.submit ??= {};
          j.submit.production ??= {};
          j.submit.production.ios ??= {};
          Object.assign(j.submit.production.ios, {
            ascApiKeyPath: keyPath,
            ascApiKeyId: keyId,
            ascApiKeyIssuerId: issuerId
          });
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE

      - name: Submit exact build to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit --platform ios --latest --profile production --non-interactive --wait --verbose
