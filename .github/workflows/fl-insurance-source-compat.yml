name: Official Florida Agency Register Compatibility

on:
  pull_request:
    paths:
      - backend/florida-official-insurance-contacts.js
      - backend/florida-official-insurance-smoke.js
      - .github/workflows/fl-insurance-source-compat.yml
  push:
    branches: [release/current]
    paths:
      - backend/florida-official-insurance-contacts.js
      - backend/florida-official-insurance-smoke.js
  schedule:
    - cron: '15 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fl-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live public Florida business licence CSV and print schema headers only
        run: node backend/florida-official-insurance-smoke.js
