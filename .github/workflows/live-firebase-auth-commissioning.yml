name: Live Firebase Auth Commissioning

on:
  # This check is required by the release/current ruleset, so it MUST run on every PR.
  pull_request:
    branches: [release/current]
  push:
    branches: [release/current]
  workflow_dispatch:
    inputs:
      password_reset:
        description: 'Use one genuine Firebase password-reset email quota request'
        type: boolean
        required: false
        default: false
  # Once daily; never one provider reset email for every commit/re-run.
  schedule:
    - cron: '17 12 * * *'

# Cancel superseded in-flight PR runs to avoid repeated live account creates.
concurrency:
  group: live-firebase-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-firebase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real account, token and sign-in; reset email only once daily or manually
        env:
          TEST_FIREBASE_PASSWORD_RESET: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.password_reset == true) }}
        run: node scripts/commission-live-firebase-auth.cjs
