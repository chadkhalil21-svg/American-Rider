name: Deterministic Commissioning

on:
  pull_request:
    branches: [release/current]
  workflow_dispatch:

jobs:
  deterministic-commissioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run commission:deterministic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-commissioning-evidence
          path: artifacts/commissioning/deterministic-commissioning.json
          if-no-files-found: error
