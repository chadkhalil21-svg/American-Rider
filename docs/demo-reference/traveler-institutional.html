<meta charset="utf-8">
<title>American Rider — Traveler</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --ink:#14171F; --ink2:#3A3F49; --muted:#8A8A82; --faint:#B4B3AB;
    --blue:#2E5FE0; --blue-t:#F0F3FC; --blue-b:#E1E9FB; --green:#1F8A5B; --green-t:#E9F3EE; --red:#B3432E; --red-b:#E6C4BC;
    --bg:#F7F7F5; --canvas:#E7E6E1; --card:#FFFFFF; --line:#ECEBE6; --line2:#E3E2DC; --fill:#EFEEE9;
    --solid:#14171F; --solid-fg:#fff; /* strong surfaces (buttons, avatars) — stay legible in both themes */
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --ink:#F3F3F1; --ink2:#C3C6CC; --muted:#8B8E96; --faint:#65686F;
    --blue:#5C86F6; --blue-t:#1A2131; --blue-b:#2B3651; --green:#41BE82; --green-t:#15271D; --red:#E0674F; --red-b:#4A2A24;
    --bg:#14171F; --canvas:#0B0D12; --card:#1B1F27; --line:#2A2E38; --line2:#343945; --fill:#232732;
    --solid:#EDEDEB; --solid-fg:#14171F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--canvas); font-family:var(--sans); color:var(--ink); display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
  #phone{ position:relative; width:100%; max-width:412px; height:100%; max-height:892px; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:480px) and (min-height:720px){ #phone{ border-radius:44px; box-shadow:0 30px 80px rgba(20,23,31,.26), 0 0 0 11px #14161c, 0 0 0 13px #23262e; height:844px; } }
  #screen{ flex:1; position:relative; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .pad{ padding:58px 24px 40px; min-height:100%; display:flex; flex-direction:column; }
  @media (min-width:480px) and (min-height:720px){ .pad{ padding-top:40px; } }

  .bar{ display:flex; align-items:center; justify-content:space-between; height:22px; margin-bottom:24px; }
  .wm{ font-size:12px; font-weight:600; letter-spacing:.26em; color:var(--ink); text-align:center; }
  .wm .n{ display:block; font-size:7.5px; letter-spacing:.34em; color:var(--faint); font-weight:600; margin-top:2px; }
  .icn{ width:22px; height:22px; color:var(--ink2); cursor:pointer; flex-shrink:0; }
  .icn.g{ color:var(--faint); }

  h1{ margin:0; font-weight:600; }
  .display{ font-size:34px; font-weight:600; letter-spacing:-.02em; line-height:1.12; }
  .title{ font-size:27px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .sub{ font-size:14.5px; color:var(--muted); margin:9px 0 0; line-height:1.5; font-weight:400; }
  .lbl{ font-size:11px; font-weight:600; letter-spacing:.15em; color:var(--muted); text-transform:uppercase; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .num{ font-variant-numeric:tabular-nums; }
  .row{ display:flex; justify-content:space-between; align-items:center; }
  .spring{ flex:1; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .hair{ border-top:1px solid var(--line); }
  .field{ width:100%; border:0; outline:none; background:transparent; font-size:16.5px; color:var(--ink); font-family:inherit; padding:0; }

  button{ font-family:inherit; }
  .btn{ display:block; width:100%; border:0; border-radius:13px; padding:18px; text-align:center; font-size:16px; font-weight:600; letter-spacing:.01em; color:var(--solid-fg); background:var(--solid); cursor:pointer; transition:opacity .2s ease; }
  .btn:active{ opacity:.86; }
  .btn:disabled{ background:#DEDDD7; color:#A9A89F; }
  .btn.blue{ background:var(--blue); }
  .btn.ghost{ background:var(--card); border:1px solid var(--line2); color:var(--ink); }
  .btn.red{ background:var(--card); border:1px solid var(--red-b); color:var(--red); }
  .link{ color:var(--blue); cursor:pointer; font-weight:500; }
  .cta-space{ margin-top:24px; }

  .seg{ position:relative; display:flex; background:var(--fill); border-radius:12px; padding:3px; }
  .seg .thumb{ position:absolute; top:3px; bottom:3px; left:3px; border-radius:9px; background:var(--solid); z-index:0; transition:transform .32s cubic-bezier(.34,.7,0,1); }
  .seg .opt{ position:relative; z-index:1; flex:1; text-align:center; padding:11px 4px; font-size:14px; font-weight:500; color:var(--ink2); cursor:pointer; user-select:none; transition:color .25s ease; }
  .seg .opt.on{ color:var(--solid-fg); font-weight:600; }

  .chips{ display:flex; flex-wrap:wrap; gap:9px; }
  .chip{ padding:11px 16px; border-radius:11px; font-size:14px; border:1px solid var(--line2); background:var(--card); color:var(--ink2); cursor:pointer; transition:all .18s ease; }
  .chip.on{ background:var(--solid); border-color:var(--solid); color:var(--solid-fg); }

  .lrow{ display:flex; align-items:center; gap:14px; padding:16px 0; cursor:pointer; }
  .pin{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .chev{ color:var(--faint); font-size:19px; margin-left:auto; }

  .av{ border-radius:50%; background:var(--solid); color:var(--solid-fg); display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
  .badge-ok{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--green); background:var(--green-t); border-radius:999px; padding:4px 10px; }

  .map{ height:190px; border-radius:16px; border:1px solid var(--line); background:#EEEEE9; position:relative; overflow:hidden; }
  .tag{ position:absolute; left:12px; top:12px; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--muted); }

  .steps{ display:flex; gap:6px; }
  .steps .b{ flex:1; height:3px; border-radius:2px; background:var(--line2); }
  .steps .b.on{ background:var(--blue); }

  .bubble{ max-width:78%; padding:12px 15px; border-radius:15px; font-size:14.5px; line-height:1.45; }
  .toggle{ width:50px; height:29px; border-radius:999px; padding:3px; display:flex; cursor:pointer; transition:background .2s; }
  .knob{ width:23px; height:23px; border-radius:50%; background:#fff; }
  .step-btn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line2); background:var(--card); font-size:19px; color:var(--ink); cursor:pointer; }

  @keyframes sweep{ to{ transform:rotate(360deg);} }
  @keyframes fadein{ from{ opacity:0; transform:translateY(7px);} to{ opacity:1; transform:translateY(0);} }
  .sweep{ animation:sweep 1.5s linear infinite; transform-origin:center; }
  #screen.fx{ animation:fadein .3s cubic-bezier(.2,.6,.2,1); }
  @media (prefers-reduced-motion:reduce){ #screen.fx{ animation:none; } .sweep{ animation:none; } }
  .note{ position:absolute; left:24px; right:24px; bottom:26px; background:var(--solid); color:var(--solid-fg); border-radius:12px; padding:14px 16px; font-size:13.5px; line-height:1.45; z-index:8; animation:fadein .3s ease; }
  .mono-ar{ width:54px; height:54px; }

  function smartlive(){
    var legs=smartLegs(), st=S.smartLeg;
    var titles=['First-Mile Operator En Route','Aboard Metrorail','Last-Mile Operator En Route'];

      h+='<div style="margin-top:16px">'+mapSVG(st===0?'FIRST MILE · MIA':'LAST MILE · MIA')+'</div>';

    legs.forEach(function(l,i){
      var done=i<st, active=i===st;
      var dot=done?'<div style="width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>':active?'<div style="width:22px;height:22px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-b);flex-shrink:0"></div>':'<div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0"></div>';
      h+='<div class="lrow'+(i>0?' hair':'')+'" style="cursor:default">'+dot+'<div><div style="font-size:14.5px;font-weight:'+(active?600:500)+';color:'+(i>st?'var(--faint)':'var(--ink)')+'">'+l.label+'</div><div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(l.to)+'</div></div><span style="margin-left:auto;font-size:12px;color:'+(active?'var(--blue)':'var(--muted)')+';font-weight:600">'+(done?'Done':active?'Now':l.min+' min')+'</span></div>';
    });
    h+='</div>';
    h+='<div class="card" style="margin-top:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13.5px;color:var(--ink2)">Travel Number</span><span class="mono" style="font-size:13px">'+S.tripNo+'</span></div>';
    h+='<div class="spring"></div><div style="display:flex;gap:10px" class="cta-space"><button class="btn" data-act="go" data-s="communicate" style="flex:1">Communicate</button><button class="btn ghost" data-act="support" style="flex:1">Patron Support</button></div></div>';
    return h;
  }

  function smartComplete(){
    var op1=+(8.00-coord(8.00)).toFixed(2), op2=+(8.50-coord(8.50)).toFixed(2), saved=+(SMART_DIRECT_TOTAL-smartTotal()).toFixed(2), tips=[0,2,5,10];
    var frow=function(l,v,strong){ return '<div class="row hair" style="padding:13px 0"><span style="font-size:14px;color:'+(strong?'var(--ink);font-weight:600':'var(--ink2)')+'">'+l+'</span><span class="num" style="font-size:14px'+(strong?';font-weight:600':'')+'">'+fmt(v)+'</span></div>'; };
    var h='<div class="pad">'+bar('menu');
    h+='<div style="text-align:center;margin-top:8px"><svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#1F8A5B" stroke-width="2" style="margin:0 auto"><circle cx="28" cy="28" r="20"/><path d="M20 28l6 6 11-12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    h+='<div class="title" style="margin-top:16px">Travel Complete</div><div class="sub" style="text-align:center">'+esc(DEPART)+' → '+esc(S.dest.name)+' · via Metrorail</div></div>';
    h+='<div style="margin-top:20px;background:var(--green-t);border:1px solid #CDE6D9;border-radius:12px;padding:14px 18px;text-align:center"><div style="font-size:14px;font-weight:600;color:var(--green)">You saved '+fmt(saved)+' and 29 minutes</div><div style="font-size:12.5px;color:var(--ink2);margin-top:3px">vs. a direct car in rush-hour traffic.</div></div>';
    h+='<div class="card" style="margin-top:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:15.5px;font-weight:600">Total Charged</span><span class="num" style="font-size:18px;font-weight:600">'+fmt(smartTotal())+'</span></div>';
    h+='<div style="margin-top:14px;background:var(--blue-t);border:1px solid var(--blue-b);border-radius:12px;padding:14px 18px"><div class="row"><span style="font-size:13.5px;color:var(--ink2)">Operators kept</span><span class="num" style="font-size:14px;font-weight:600;color:var(--blue)">'+fmt(op1)+' + '+fmt(op2)+'</span></div><div style="font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5">Two operators, each keeping <b>99% of their fare</b>.</div></div>';
    h+='<div style="margin-top:24px" class="lbl">Travel Review</div><div style="display:flex;gap:10px;margin-top:12px">';
    for(var i=1;i<=5;i++){ h+='<svg data-act="rate" data-n="'+i+'" width="30" height="30" viewBox="0 0 24 24" fill="'+(i<=S.rating?'var(--ink)':'none')+'" stroke="var(--ink)" stroke-width="1.5" style="cursor:pointer"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8-4.2-4.1 5.9-.9z" stroke-linejoin="round"/></svg>'; }
    h+='</div>';
    h+='<div style="margin-top:24px" class="lbl">Tip Operators</div><div style="font-size:12.5px;color:var(--muted);margin-top:6px">Split between both operators. They keep 100%.</div><div class="chips" style="margin-top:12px">';
    tips.forEach(function(tt){ h+='<div class="chip'+(S.tip===tt?' on':'')+'" data-act="tip" data-v="'+tt+'" style="min-width:64px;text-align:center">'+(tt===0?'None':'$'+tt)+'</div>'; });
    h+='</div><div class="spring"></div><button class="btn cta-space" data-act="finish">Complete</button></div>';
    return h;
  }

  function settingsScr(){
    var h='<div class="pad">'+bar('back')+'<div class="title">Settings</div>';
    h+='<div class="lbl" style="margin-top:24px">Appearance</div>';
    h+='<div class="seg" style="margin-top:12px"><div class="thumb" style="width:calc((100% - 6px)/2);transform:translateX('+(S.theme==='dark'?100:0)+'%)"></div>'
      +'<div class="opt'+(S.theme==='light'?' on':'')+'" data-act="settheme" data-v="light">Light</div>'
      +'<div class="opt'+(S.theme==='dark'?' on':'')+'" data-act="settheme" data-v="dark">Dark</div></div>';
    h+='<div style="font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5">Choose a look that\'s easy on your eyes. Dark mode applies across the whole app on this device. New devices start in light.</div>';
    h+='<div class="lbl" style="margin-top:26px">Preferences</div><div class="card" style="margin-top:12px;padding:2px 20px">';
    h+='<div class="lrow" data-act="go" data-s="notif" style="cursor:pointer"><span style="font-size:15px">Notifications</span><span class="chev">›</span></div>';
    h+='<div class="lrow hair" data-act="note-t" style="cursor:pointer"><span style="font-size:15px">Language</span><span style="margin-left:auto;font-size:14px;color:var(--muted)">English</span><span class="chev" style="margin-left:10px">›</span></div>';
    h+='<div class="lrow hair" data-act="note-t" style="cursor:pointer"><span style="font-size:15px">Privacy</span><span class="chev">›</span></div>';
    h+='<div class="lrow hair" data-act="note-t" style="cursor:pointer"><span style="font-size:15px">Security &amp; Face ID</span><span class="chev">›</span></div>';
    h+='</div><div class="spring"></div></div>';

  function notifScr(){
    var items=[['arrived','Operator arrived','Chime the moment your operator reaches you'],['enroute','Operator en route','When your operator is on the way'],['complete','Travel complete','Your receipt, ready after each trip'],['promos','Offers &amp; promotions','Occasional deals — off by default']];
    var h='<div class="pad">'+bar('back')+'<div class="title">Notifications</div><div class="sub">Choose what American Rider alerts you about — with sound.</div>';
    h+='<div class="card" style="margin-top:20px;padding:4px 20px">';
    items.forEach(function(it,i){ var on=S.notif[it[0]]; h+='<div class="lrow'+(i>0?' hair':'')+'" style="cursor:default"><div style="flex:1"><div style="font-size:15px">'+it[1]+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px">'+it[2]+'</div></div><div class="sw'+(on?' on':'')+'" data-act="togglenotif" data-k="'+it[0]+'"><div class="swk"></div></div></div>'; });
    h+='</div>';
    h+='<div style="font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5">Delivered to your phone with your chosen sound. You can silence any alert here at any time.</div>';
    h+='<div class="spring"></div></div>';
    return h;
  }
  var SCREENS={ welcome:welcome, home:home, search:search, options:options, smart:smart, prefs:prefs, confirm:confirm, searching:searching, enroute:enroute, smartlive:smartlive, communicate:communicate, complete:complete, account:account, profile:profile, wallet:wallet, log:logScreen, receipt:receipt, support:support, safety:safety, economics:economics, settings:settingsScr, notif:notifScr, scheduled:scheduledScr, refer:referralScr };

  function render(){
    var el=document.getElementById('screen');
    var f=document.activeElement, fid=f&&f.id, fp=f&&f.selectionStart;
    el.className='';
    el.innerHTML=(SCREENS[S.screen]||home)();
    void el.offsetWidth; el.className='fx';
    if(fid){ var n=document.getElementById(fid); if(n){ n.focus(); try{n.setSelectionRange(fp,fp);}catch(e){} } } else el.scrollTop=0;
    clearRide(); // re-renders never stack ride timers
    if(S.screen==='searching'||S.screen==='enroute'){
      // Absolute-timeline scheduling: phases fire at fixed targets from ride start,
      // so an incidental re-render can neither stack nor delay the ride.
      var t0=S.rideT0||Date.now(), el=Date.now()-t0;
      var at=function(ms,fn){ if(ms>el) afterRide(ms-el,fn); };
      if(S.screen==='searching'){ at(2600,function(){ S.enrouteStep=0; reset('enroute'); }); }
      else {
        if(S.enrouteStep===1) startFinder(); else animateMap();
        at(5800,function(){ if(S.screen!=='enroute'||S.enrouteStep!==0)return; S.enrouteStep=1; updateEnroute(); });
        at(12800,function(){ if(S.screen!=='enroute'||S.enrouteStep!==1)return; S.enrouteStep=2; updateEnroute(); });
        at(16000,function(){ if(S.screen!=='enroute'||S.enrouteStep!==2)return; S.enrouteStep=3; updateEnroute(); });
        at(18600,function(){ if(S.screen==='enroute') reset('complete'); });
      }
    } else if(S.screen==='smartlive'){
      var lg=smartLegs()[S.smartLeg];
      if(lg&&lg.icon==='car') animateMap(); else stopMap();
      afterRide(4200,function(){ if(S.screen!=='smartlive')return; if(S.smartLeg<2){ S.smartLeg++; render(); } else { reset('complete'); } });
    } else { stopMap(); stopFinder(); }
    if(S.note){ el.insertAdjacentHTML('beforeend','<div class="note">'+esc(S.note)+'</div>'); }
  }

  function sendMsg(){ var t=(S.msgInput||'').trim(); if(!t)return; S.msgs.push({me:true,text:t}); S.msgInput=''; after(1500,function(){ S.msgs.push({me:false,text:'Understood — see you shortly.'}); if(S.screen==='communicate')render(); }); render(); }

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t)return;
    var a=t.getAttribute('data-act');
    if(t.closest('#drawer') && a!=='opendrawer') closeDrawer(); // drawer taps navigate + close
    var A={
      opendrawer:openDrawer, closedrawer:closeDrawer,
      go:function(){ go(t.getAttribute('data-s')); },
      reset:function(){ reset(t.getAttribute('data-s')); },
      back:function(){ back(); },
      pickdest:function(){ S.dest=PLACES[+t.getAttribute('data-i')]; S.travelClass='Standard'; S.smart=false; go('options'); },
      pickrecent:function(){ var r=RECENT[+t.getAttribute('data-i')]; S.dest={name:r.name,short:r.short,base:r.base,eta:r.eta}; S.travelClass='Standard'; S.smart=false; go('options'); },
      pickclass:function(){ var k=t.getAttribute('data-k'); if(S.travelClass===k){ go('prefs'); return; } S.travelClass=k; render(); },
      pickcustom:function(){ var n=t.getAttribute('data-name'); var hsh=0; for(var i=0;i<n.length;i++)hsh=(hsh*31+n.charCodeAt(i))%97; S.dest={name:n,short:n,base:+(9+(hsh%23)+0.5).toFixed(2),eta:10+(hsh%25)}; S.travelClass='Standard'; S.smart=false; go('options'); },
      gosmart:function(){ go('smart'); },
      confirmsmart:function(){ S.smart=true; S.smartLeg=0; S.tripNo='AR-'+(2047+(++S.tripCount))+'-SMT'; reset('smartlive'); },
      segset:function(){ var key=t.getAttribute('data-k'), v=t.getAttribute('data-v'), i=+t.getAttribute('data-i'); if(S[key]===v)return; S[key]=v; var seg=t.closest('.seg'); if(seg){ var thumb=seg.querySelector('.thumb'); if(thumb)thumb.style.transform='translateX('+(i*100)+'%)'; var opts=seg.querySelectorAll('.opt'); for(var j=0;j<opts.length;j++){ opts[j].classList.toggle('on', opts[j].getAttribute('data-v')===v); } } if(key==='music'){ var note=document.getElementById('musicNote'); if(note)note.style.display=(v==='Traveler Choice')?'block':'none'; } },
      toggle:function(){ var k=t.getAttribute('data-k'); S.add[k]=!S.add[k]; t.classList.toggle('on', S.add[k]); },
      setwhen:function(){ S.schedWhen=t.getAttribute('data-w'); render(); },
      schedule:function(){ S.upcoming.unshift({ dest:S.dest.name, when:S.schedWhen, total:total(), no:'AR-'+(2047+(++S.tripCount))+'-MIA' }); S.schedWhen='Now'; reset('scheduled'); },
      cancelsched:function(){ var i=+t.getAttribute('data-i'); S.upcoming.splice(i,1); render(); },
      'search-op':function(){ S.tripNo='AR-'+(2047+(++S.tripCount))+'-MIA'; S.rideT0=Date.now(); reset('searching'); },
      cancelTravel:function(){ S.smart=false; reset('home'); },
      settheme:function(){ applyTheme(t.getAttribute('data-v')); render(); },
      togglenotif:function(){ var k=t.getAttribute('data-k'); S.notif[k]=!S.notif[k]; t.classList.toggle('on', S.notif[k]); },
      send:sendMsg,
      rate:function(){ S.rating=+t.getAttribute('data-n'); render(); },
      tip:function(){ S.tip=+t.getAttribute('data-v'); render(); },
      finish:function(){ var tr={arr:S.dest.name, dep:DEPART, date:'Just now', cost:S.smart?smartCost():cost(), no:S.tripNo}; if(!S.seed.length||S.seed[0].no!==tr.no) S.seed.unshift(tr); S.tip=0; S.rating=0; S.smart=false; reset('home'); },
      viewreceipt:function(){ var tr={arr:S.dest.name, dep:DEPART, date:'Just now', cost:S.smart?smartCost():cost(), no:S.tripNo}; if(!S.seed.length||S.seed[0].no!==tr.no) S.seed.unshift(tr); S.viewTrip=tr; go('receipt'); },
      support:function(){ S.issue=null; S.issueState=null; go('support'); },
      pickissue:function(){ S.issue=t.getAttribute('data-k'); S.issueState='resolving'; render(); after(1800,function(){ S.issueState='resolved'; if(S.screen==='support')render(); }); },
      escalate:function(){ S.issueState='escalated'; render(); },
      setpay:function(){ S.pay=t.getAttribute('data-k'); render(); },
      logfilter:function(){ S.logFilter=t.getAttribute('data-k'); render(); },
      viewtrip:function(){ var no=t.getAttribute('data-no'); S.viewTrip=S.seed.filter(function(x){return x.no===no;})[0]; go('receipt'); },
      share:function(){ S.sharedWith=(S.trusted[0]&&S.trusted[0].name)||'A trusted contact'; render(); },
      stopshare:function(){ S.sharedWith=null; render(); },
      addtrusted:function(){ if(S.trusted.length<3)S.trusted.push({name:'Second contact'}); render(); },
      step:function(){ var k=t.getAttribute('data-k'), d=+t.getAttribute('data-d'); if(k==='fare')S.econ.fare=Math.max(5,+(S.econ.fare+d*1.5).toFixed(2)); if(k==='rides')S.econ.rides=Math.max(5,S.econ.rides+d*5); if(k==='ins')S.econ.ins=Math.max(50,S.econ.ins+d*25); render(); },
      becomeop:function(){ if(window.self!==window.top){ try{ window.parent.postMessage('ar:becomeOperator','*'); return; }catch(err){} } S.note='Operator qualification opens the document verification flow.'; render(); after(2600,function(){ S.note=''; render(); }); },
      note:function(){ var msg=t.getAttribute('data-t'); S.note=msg; render(); after(2600,function(){ if(S.note===msg){ S.note=''; render(); } }); },
      'note-t':function(){ S.note='This screen opens in the full build.'; render(); after(2400,function(){ S.note=''; render(); }); }
    };
    if(A[a]){ e.preventDefault(); A[a](); }
  });
  document.addEventListener('input',function(e){ var k=e.target.getAttribute&&e.target.getAttribute('data-input'); if(!k)return; S[k]=e.target.value; if(k==='searchQ')render(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-enter')){ e.preventDefault(); sendMsg(); } });

  // Uber-style quick-access drawer — lives outside #screen so it survives re-renders.
  function openDrawer(){ document.getElementById('scrim').classList.add('on'); document.getElementById('drawer').classList.add('on'); }
  function closeDrawer(){ document.getElementById('scrim').classList.remove('on'); document.getElementById('drawer').classList.remove('on'); }
  function drow(label,act,s){ return '<div class="drow" data-act="'+act+'"'+(s?' data-s="'+s+'"':'')+'><span>'+label+'</span><span class="chev">›</span></div>'; }
  document.getElementById('phone').insertAdjacentHTML('beforeend',
    '<div id="scrim" class="scrim" data-act="closedrawer"></div>'
    +'<div id="drawer" class="drawer">'
    +'<div data-act="go" data-s="profile" style="display:flex;align-items:center;gap:13px;padding-bottom:20px;cursor:pointer">'+av(RIDER.init,48)+'<div><div style="font-size:17px;font-weight:600">'+RIDER.name+'</div><div style="font-size:12.5px;color:var(--blue);margin-top:3px;font-weight:500">View profile ›</div></div></div>'
    +drow('Wallet','go','wallet')
    +drow('Travel Log','go','log')
    +drow('Patron Support','support')
    +drow('Safe Travels','go','safety')
    +drow('Invite Friends','go','refer')
    +drow('Become an Operator','go','economics')
    +drow('Notifications','go','notif')
    +drow('Settings','go','settings')
    +drow('About American Rider','note-t')
    +'<div class="spring"></div>'
    +'<div class="drow" data-act="reset" data-s="welcome" style="color:var(--red)"><span>Sign Out</span></div>'
    +'</div>');

  // When embedded in the unified app, the account already exists — skip the welcome screen.
  if(window.self!==window.top){ S.screen='home'; }
  render();
})();
</script>
