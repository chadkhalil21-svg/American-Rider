name: TestFlight credential availability (no values)
on:
  push:
    branches: [testflight/credential-presence-20261016]
    paths:
      - '.github/workflows/testflight-credential-presence-20261016.yml'
permissions:
  contents: read
jobs:
  check-names-only:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - name: Report credential presence without disclosing values
        shell: bash
        run: |
          for key in EXPO_TOKEN ASC_API_KEY_BASE64 ASC_API_KEY_P8; do
            if test -n "${!key}"; then
              echo "${key}: configured"
            else
              echo "${key}: absent"
            fi
          done
