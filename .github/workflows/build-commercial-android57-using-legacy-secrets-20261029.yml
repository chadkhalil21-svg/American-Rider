name: Build certified Commercial Android AAB using legacy Expo credential (internal candidate only)

on:
  push:
    branches: [ops/commercial-build57-secure-bridge-20261029]
    paths:
      - 'ops/activation/build-commercial-android-20261029.approved'

permissions:
  contents: read

jobs:
  build-certified-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: commercial
    concurrency:
      group: one-time-certified-commercial-android-20261029
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CERTIFIED_SHA: 52bb2aaea33b25ee795d6230459f4124ae06f1d2
    steps:
      - name: Check out legacy credential authority marker
        uses: actions/checkout@v4
        with:
          path: authority
          persist-credentials: false

      - name: Require one-time approved Android Build 57 marker
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test -f authority/ops/activation/build-commercial-android-20261029.approved
          grep -Fxq 'FOUNDER_APPROVED=BUILD_COMMERCIAL_ANDROID_57_AAB_20261029' authority/ops/activation/build-commercial-android-20261029.approved
          grep -Fxq 'CERTIFIED_SHA=52bb2aaea33b25ee795d6230459f4124ae06f1d2' authority/ops/activation/build-commercial-android-20261029.approved
          grep -Fxq 'RETRY=CORRECT_PREFLIGHT_DIRECTORY_1' authority/ops/activation/build-commercial-android-20261029.approved
          test "$(wc -l < authority/ops/activation/build-commercial-android-20261029.approved)" -eq 3

      - name: Require exact revision and Expo account
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A 40-character commit SHA is required."; exit 1; }
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is not configured."; exit 1; }

      - name: Check out exact Commercial release, never older source
        uses: actions/checkout@v4
        with:
          repository: chadkhalil21-svg/American-Rider-Commercial
          ref: ${{ env.CERTIFIED_SHA }}
          path: commercial
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify this is the current tested release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA" || { echo "::error::Incorrect checkout."; exit 1; }
          git fetch origin release/current --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$CERTIFIED_SHA" || { echo "::error::This is not the current release/current commit."; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json','utf8'));
          if (app.android?.package !== 'com.americanrider.app') throw Error('Unexpected Android package.');
          if (eas.build?.production?.distribution === 'internal') throw Error('Not a store build.');
          if (eas.build?.production?.android?.buildType === 'apk') throw Error('Google Play requires an app bundle.');
          if (!eas.build?.production) throw Error('Production build profile is missing.');
          if (eas.submit?.production?.android?.track !== 'production') throw Error('Public Android submission must use production track.');
          if (eas.submit?.internal?.android?.track !== 'internal') throw Error('Internal Android submission must remain on internal track.');
          console.log('Verified current Android app identity and store build profile.');
          NODE

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Verify isolated synthetic journey, money and native wallet source contracts
        run: node scripts/prelaunch-synthetic-acceptance.cjs

      - name: Require real Google Cloud Run API before certified store build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-store-cloudrun-api.cjs

      - name: Build signed production Android bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-android.json"
          node - "$RUNNER_TEMP/eas-android.json" <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const b = Array.isArray(data) ? data[0] : data;
          if (!b?.id || String(b.platform).toLowerCase() !== 'android' || String(b.status).toLowerCase() !== 'finished') {
            throw Error('EAS did not confirm a completed Android build.');
          }
          console.log('Completed Android EAS build:', b.id);
          fs.appendFileSync(process.env.GITHUB_ENV, 'EAS_BUILD_ID=' + b.id + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Android store candidate built\n\nExact source: `' + process.env.CERTIFIED_SHA +
            '`\n\nEAS build ID: `' + b.id +
            '`\n\n**Not approved for public Google Play.** Optional explicit internal-testing upload may follow; public review, data safety and physical-device validation remain separate.\n');
          NODE

