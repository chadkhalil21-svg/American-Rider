name: Live Firebase Auth Commissioning

on:
  # This check is required by the release/current ruleset, so it MUST run on every PR.
  pull_request:
    branches: [release/current]
  push:
    branches: [release/current]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-firebase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise production Firebase account and session boundary
        run: node scripts/commission-live-firebase-auth.cjs
