name: Firestore Composite Index Commissioning

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit first; create only indexes missing from the committed manifest
        required: true
        default: audit
        type: choice
        options:
          - audit
          - create_missing
      confirm_project:
        description: For create_missing, enter american-rider-35688 exactly
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-index-production
  cancel-in-progress: false

jobs:
  firestore-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify index commissioner's parsing and no-delete contract
        run: node scripts/firestore-index-commission.test.cjs
      - name: Authenticate to Google Cloud without a long-lived key
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: american-rider-35688
          # These are public resource identifiers, NOT credentials.
          # Access is enforced by Google Cloud OIDC conditions (repo ID, release ref,
          # workflow path, and manual dispatch), plus the SA index-only IAM role.
          workload_identity_provider: projects/623854974930/locations/global/workloadIdentityPools/american-rider-github/providers/github
          service_account: firestore-index-deployer@american-rider-35688.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/datastore
      - name: Audit / create only missing Firestore composite indexes
        run: node scripts/firestore-index-commission.cjs
        env:
          FIRESTORE_INDEX_ACTION: ${{ inputs.operation }}
          FIRESTORE_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          FIRESTORE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
