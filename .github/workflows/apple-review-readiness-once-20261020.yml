name: One-time read-only Apple App Store publication readiness
on:
  push:
    branches: [ci/one-time-apple-review-readiness-20261020]
    paths: ['.github/workflows/apple-review-readiness-once-20261020.yml']
permissions:
  contents: read
jobs:
  inspect-apple-store-metadata:
    if: ${{ github.ref == 'refs/heads/ci/one-time-apple-review-readiness-20261020' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_KEY_ID: LS74L322NV
      ASC_ISSUER_ID: 2fa282d5-2b2c-4820-8fe9-6928ac1e8d33
    steps:
      - name: Read only Apple version/build/review state (no personal data)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request, urllib.error
          import jwt
          key=base64.b64decode(os.environ['ASC_API_KEY_BASE64'])
          token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+600,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          root='https://api.appstoreconnect.apple.com/v1'
          def get(path,params=None):
              url=root+path+('?' + urllib.parse.urlencode(params) if params else '')
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
              except urllib.error.HTTPError as err:
                  print('READ_ONLY_UNAVAILABLE',path,'HTTP',err.code)
                  return {}
          app='6798078543'
          versions=get('/apps/'+app+'/appStoreVersions',{'filter[platform]':'IOS','include':'build,appStoreVersionLocalizations','limit':'30'})
          included={x['id']:x for x in versions.get('included',[])}
          vrows=[]
          for v in versions.get('data',[]):
              attrs=v.get('attributes',{});rels=v.get('relationships',{})
              loc=rels.get('appStoreVersionLocalizations',{}).get('data',[])
              b=rels.get('build',{}).get('data')
              row={'version':attrs.get('versionString'),'appVersionState':attrs.get('appVersionState'),'releaseType':attrs.get('releaseType'),'selectedBuild':(included.get(b['id'],{}).get('attributes',{}).get('version') if b else None),'localizationCount':len(loc)}
              # Count only; do not print localization text or reviewer contact data.
              screenshotSets=0
              for l in loc[:10]:
                  screens=get('/appStoreVersionLocalizations/'+l['id']+'/appScreenshotSets',{'limit':'50'})
                  screenshotSets+=len(screens.get('data',[]))
              row['screenshotSetCount']=screenshotSets
              vrows.append(row)
          print('IOS_STORE_VERSIONS',json.dumps(vrows))
          builds=get('/builds',{'filter[app]':app,'filter[version]':'47','limit':'20','fields[builds]':'version,processingState,uploadedDate,expired'})
          print('EXACT_APPLE_BUILD_47',json.dumps([{'id':x.get('id'),'number':x.get('attributes',{}).get('version'),'processingState':x.get('attributes',{}).get('processingState'),'expired':x.get('attributes',{}).get('expired')} for x in builds.get('data',[])]))
          print('APPLE_VERSION_ID',[(v.get('id'),v.get('attributes',{}).get('appVersionState')) for v in versions.get('data',[])])
          for v in versions.get('data',[]):
              for lc in v.get('relationships',{}).get('appStoreVersionLocalizations',{}).get('data',[]):
                  detail=get('/appStoreVersionLocalizations/'+lc['id']); a=detail.get('data',{}).get('attributes',{})
                  print('LOCALIZATION_FIELDS',{'locale':a.get('locale'),'description':bool(a.get('description')),'keywords':bool(a.get('keywords')),'supportUrl':bool(a.get('supportUrl')),'marketingUrl':bool(a.get('marketingUrl')),'promotionalText':bool(a.get('promotionalText')),'screenshots':False})
          reviews=get('/apps/'+app+'/reviewSubmissions',{'limit':'10'})
          print('REVIEW_SUBMISSIONS',json.dumps([{'state':x.get('attributes',{}).get('state')} for x in reviews.get('data',[])][:10]))
          print('Read-only complete; no app metadata, review, or submission was changed.')
          PY
