name: Whole Platform Adversarial Trace

on:
  pull_request:
    branches: [release/current]
  workflow_dispatch:

jobs:
  double-whole-platform-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run commission:whole-platform-twice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: double-whole-platform-adversarial-trace
          path: artifacts/commissioning/double-whole-platform-adversarial-trace.json
          if-no-files-found: error
