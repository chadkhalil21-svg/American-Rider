name: Submit certified iOS build to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-certified-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CERTIFIED_SHA: c6c04aff0ab685eda348319df360743962856fd5

    steps:
      - name: Check out certified release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install certified release dependencies
        run: npm ci --ignore-scripts

      - name: Require Expo authorization
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub secret EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Verify certified source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$CERTIFIED_SHA" ]; then
            echo "::error::Refusing submission: checked-out SHA $ACTUAL_SHA does not equal certified SHA $CERTIFIED_SHA."
            exit 1
          fi
          echo "Certified source verified: $ACTUAL_SHA"

      - name: Submit latest certified iOS build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit \
            --platform ios \
            --latest \
            --profile production \
            --non-interactive \
            --wait
