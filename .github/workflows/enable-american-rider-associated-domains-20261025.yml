name: Enable American Rider Associated Domains once
on:
  push:
    branches: [ops/ios-universal-links-audit-20261025]
    paths: [.github/workflows/enable-american-rider-associated-domains-20261025.yml]
permissions:
  contents: read
jobs:
  apple-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_KEY_ID: LS74L322NV
      ASC_ISSUER_ID: 2fa282d5-2b2c-4820-8fe9-6928ac1e8d33
    steps:
      - name: Prepare existing authenticated Apple API (no credentials printed)
        run: python3 -m pip install --quiet --user PyJWT cryptography
      - name: Enable only Associated Domains for the verified American Rider app
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64,json,time,sys,urllib.request,urllib.parse,urllib.error
          import jwt
          APP='com.americanrider.app'
          TEAM='6Z24V6YD4A'
          key=base64.b64decode(os.environ['ASC_API_KEY_BASE64'])
          token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),
             'exp':int(time.time())+500,'aud':'appstoreconnect-v1'},key,
             algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          base='https://api.appstoreconnect.apple.com/v1'
          def api(route,body=None):
            url=base+route
            method='POST' if body is not None else 'GET'
            req=urllib.request.Request(url,method=method,
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'},
              data=json.dumps(body).encode() if body is not None else None)
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
            except urllib.error.HTTPError as e:
              errors=[]
              try: errors=[(x.get('code'),x.get('title'),x.get('detail','')[:200])
                 for x in json.loads(e.read()).get('errors',[])]
              except Exception: pass
              raise SystemExit('Apple denied '+method+' '+route.split('?')[0]+
                 ' status='+str(e.code)+' errors='+str(errors))
          ids=api('/bundleIds?'+urllib.parse.urlencode({'filter[identifier]':APP,'limit':10}))['data']
          records=[r for r in ids if r.get('attributes',{}).get('identifier')==APP]
          if len(records)!=1: raise SystemExit('Exactly one registered American Rider app identifier is required')
          record=records[0]
          if record['attributes'].get('seedId') not in (TEAM,None,''):
            raise SystemExit('Apple Team ID does not match verified American Rider identity')
          bid=record['id']
          def caps():return [r.get('attributes',{}).get('capabilityType') for r in
            api('/bundleIds/'+bid+'/bundleIdCapabilities')['data']]
          current=caps()
          print('BEFORE Associated Domains:', 'ASSOCIATED_DOMAINS' in current)
          if 'ASSOCIATED_DOMAINS' not in current:
            payload={'data':{'type':'bundleIdCapabilities',
              'attributes':{'capabilityType':'ASSOCIATED_DOMAINS'},
              'relationships':{'bundleId':{'data':{'type':'bundleIds','id':bid}}}}}
            created=api('/bundleIdCapabilities',payload)
            if created.get('data',{}).get('attributes',{}).get('capabilityType')!='ASSOCIATED_DOMAINS':
              raise SystemExit('Unexpected Apple capability creation response')
            print('Associated Domains addition acknowledged by Apple.')
          else: print('Associated Domains was already enabled. No mutation needed.')
          newer=caps()
          if 'ASSOCIATED_DOMAINS' not in newer:
            raise SystemExit('Associated Domains still absent after Apple API response')
          if set(current)-set(newer):raise SystemExit('ERROR: previously enabled capability disappeared')
          print('VERIFIED: Associated Domains ENABLED for '+APP)
          print('Other Apple capabilities preserved:',sorted(set(current)))
          print('NEXT: regenerate distribution provisioning profile and verify entitlement before signing.')
          PY
