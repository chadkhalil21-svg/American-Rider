name: Founder-authorized exact current Commercial TestFlight 3155071 (24 Oct 2026)

# One-time founder-authorized signed build of CURRENT commercial release using existing LEGACY repository secrets.
# No secrets copied to the Commercial repository, artifacts or logs.
# TestFlight only. Public App Store submission requires separate review and approval.
# Retry after verified Fastlane Xcode build-settings timeout; no new credentials.
# Check out exact current Commercial application; do not copy credentials or deploy backend.
on:
  push:
    branches: [ci/founder-current-commercial-testflight-3155071-fastlane-20261024]
    paths:
      - '.github/workflows/founder-commercial-testflight-3155071-20261024.yml'

permissions:
  contents: read

jobs:
  build-submit-certified-ios:
    runs-on: macos-26-intel
    timeout-minutes: 120
    concurrency:
      group: testflight-certified-commercial-3155071
      cancel-in-progress: false
    env:
      ASC_KEY_ID: LS74L322NV
      ASC_ISSUER_ID: 2fa282d5-2b2c-4820-8fe9-6928ac1e8d33
      CERTIFIED_SHA: 3155071676ab97df11bc101374f8eb2409c6c533

    steps:
      - name: Check out exact Commercial release (not legacy source)
        uses: actions/checkout@v4
        with:
          repository: chadkhalil21-svg/American-Rider-Commercial
          ref: ${{ env.CERTIFIED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install isolated backend test dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Require submission credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is not configured."; exit 1; }
          test -n "$ASC_API_KEY_BASE64" || { echo "::error::ASC_API_KEY_BASE64 is not configured."; exit 1; }

      - name: Verify immutable certified current Commercial application
        shell: bash
        env:
          EXPECTED_TIP: 3155071676ab97df11bc101374f8eb2409c6c533
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA" || { echo "::error::Wrong app source."; exit 1; }
          git fetch origin release/current --depth=1
          RELEASE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$RELEASE_SHA" = "$EXPECTED_TIP" || { echo "::error::Commercial release changed; refuse stale binary."; exit 1; }
          # This build checks out the actual latest certified Commercial source,
          # rather than a stale former binary plus an allowlist of newer changes.
          # Do not require old one-time markers from previous releases.
          echo "PASS: exact current certified Commercial code checked out; founder-authorized TestFlight only."
          echo "PASS: exact current Commercial app source and founder approval."

      - name: Run isolated commercial prelaunch acceptance suites
        run: node scripts/prelaunch-synthetic-acceptance.cjs

      - name: Configure owner-controlled App Store Connect key and select build number
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-python"
          "$RUNNER_TEMP/asc-python/bin/python" -m pip install --quiet PyJWT cryptography
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          "$RUNNER_TEMP/asc-python/bin/python" - "$KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'PY'
          import base64, json, sys, time, urllib.parse, urllib.request
          key_path, key_id, issuer_id = sys.argv[1:]
          try:
              import jwt
          except ImportError:
              raise SystemExit("PyJWT is required for App Store Connect build discovery")
          with open(key_path, "rb") as fh:
              private_key = fh.read()
          token = jwt.encode(
              {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          q = urllib.parse.urlencode({
              "filter[app]": "6798078543",
              "filter[preReleaseVersion.version]": "1.0.0",
              "filter[preReleaseVersion.platform]": "IOS",
              "fields[builds]": "version",
              "limit": "200",
          })
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/builds?" + q,
                                       headers={"Authorization": "Bearer " + token})
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          nums = [int(x["attributes"]["version"]) for x in data.get("data", [])
                  if str(x.get("attributes", {}).get("version", "")).isdigit()]
          next_build = max(nums, default=0) + 1
          with open("app.json") as fh:
              app = json.load(fh)
          app.setdefault("expo", {}).setdefault("ios", {})["buildNumber"] = str(next_build)
          with open("app.json", "w") as fh:
              json.dump(app, fh, indent=2); fh.write("\n")
          with open("eas.json") as fh:
              eas = json.load(fh)
          eas.setdefault("cli", {})["appVersionSource"] = "local"
          eas.setdefault("build", {}).setdefault("production", {})["autoIncrement"] = False
          ios = eas.setdefault("submit", {}).setdefault("production", {}).setdefault("ios", {})
          ios.update({"ascApiKeyPath": key_path, "ascApiKeyId": key_id, "ascApiKeyIssuerId": issuer_id})
          with open("eas.json", "w") as fh:
              json.dump(eas, fh, indent=2); fh.write("\n")
          with open("/tmp/next_build_number", "w") as fh:
              fh.write(str(next_build))
          print("Selected next unused iOS build number:", next_build)
          PY

      - name: Verify unchanged backend and actual paid Cloud Run production API (read only)
        shell: bash
        env:
          BACKEND_SHA: 9f58d41596a3d52764a45066756ff72cbf1472f8
          CERTIFIED_SHA: 9f58d41596a3d52764a45066756ff72cbf1472f8
        run: |
          set -euo pipefail
          # Exact release/current is 3155071, but its sole parent-change since
          # the deployed 9f58d41 backend consists of corporate website/docs/tests.
          # Prove this on actual Git objects. Any app/runtime/backend change fails
          # closed rather than declaring stale Cloud Run acceptable.
          git fetch origin "$BACKEND_SHA" --depth=1
          git cat-file -e "$BACKEND_SHA^{commit}"
          changed="$(git diff --name-only "$BACKEND_SHA" HEAD)"
          test -n "$changed" || { echo "::error::Expected corporate-only release delta missing."; exit 1; }
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/live-website-preview-acceptance-20261024.yml|\
              .github/workflows/live-website-user-audit-20261024.yml|\
              PROJECT-LEDGER.md|\
              backend/corporate-website.test.js|\
              backend/referral-link-recovery-contract.test.js|\
              docs/audits/2026-10-24-national-website-voice-and-user-journey.md|\
              scripts/audit-corporate-live-site.cjs|\
              scripts/build-corporate-website.cjs|\
              scripts/corporate-heritage-design.cjs|\
              scripts/corporate-recruiter-portal.cjs|\
              scripts/test-corporate-website.cjs) ;;
              *) echo "::error::Runtime drift found in $file; require exact protected backend deployment."; exit 1 ;;
            esac
          done <<< "$changed"
          echo "PASS: certified iOS tip includes corporate-only changes since deployed backend."
          node scripts/verify-store-cloudrun-api.cjs

      - name: Build certified iOS locally on GitHub macOS without Expo cloud build quota
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Xcode 26.6 reached Fastlane; its 3/6/12/24s settings lookup timed out.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          command -v pod
          command -v fastlane
          npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/american-rider-certified.ipa"
          test -s "$RUNNER_TEMP/american-rider-certified.ipa" || { echo "::error::Signed iOS archive missing."; exit 1; }
          echo "PASS: exact Commercial app built and signed locally. Prepared for Apple upload."

      - name: Refuse release drift during signing
        shell: bash
        env:
          EXPECTED_TIP: 3155071676ab97df11bc101374f8eb2409c6c533
        run: |
          set -euo pipefail
          git fetch origin release/current --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TIP" || { echo "::error::Commercial release changed during iOS signing; do not submit stale app."; exit 1; }

      - name: Submit exact signed local iOS archive to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/american-rider-certified.ipa" || { echo "::error::Signed iOS archive missing."; exit 1; }
          npx --yes eas-cli@latest submit --platform ios --path "$RUNNER_TEMP/american-rider-certified.ipa" --profile production --non-interactive --wait --verbose
