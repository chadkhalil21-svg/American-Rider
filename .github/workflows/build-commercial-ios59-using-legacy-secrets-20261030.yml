name: Build certified Commercial Build 59 using existing legacy credentials (TestFlight only)

# Founder approved prior Build 56 using these existing credentials. This Build 59 bridge is gated by a separate one-time approval marker. The older repository hosts
# existing credentials, while exact Commercial source is checked out below.
on:
  push:
    branches: [ops/commercial-build59-secure-bridge-20261030]
    paths:
      - 'ops/activation/build-commercial-ios59-20261030.approved'

permissions:
  contents: read

jobs:
  build-submit-certified-ios:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ops/commercial-build59-secure-bridge-20261030' }}
    runs-on: macos-26
    timeout-minutes: 150
    concurrency:
      group: one-time-certified-commercial-ios59-20261030
      cancel-in-progress: false
    defaults:
      run:
        working-directory: commercial
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_KEY_ID: LS74L322NV
      ASC_ISSUER_ID: 2fa282d5-2b2c-4820-8fe9-6928ac1e8d33
      CERTIFIED_SHA: eba2c05a99cecda6c75160e2810b683cca70bd00

    steps:
      - name: Check out older credential repository marker
        uses: actions/checkout@v4
        with:
          path: authority
          persist-credentials: false

      - name: Verify exact one-time Founder approval
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test -f authority/ops/activation/build-commercial-ios59-20261030.approved
          grep -Fxq 'FOUNDER_APPROVED=BUILD_COMMERCIAL_IOS_59_TESTFLIGHT_20261030' authority/ops/activation/build-commercial-ios59-20261030.approved
          grep -Fxq 'CERTIFIED_SHA=eba2c05a99cecda6c75160e2810b683cca70bd00' authority/ops/activation/build-commercial-ios59-20261030.approved
          test "$(wc -l < authority/ops/activation/build-commercial-ios59-20261030.approved)" -eq 2

      - name: Check out exact Commercial release, never older application source
        uses: actions/checkout@v4
        with:
          repository: chadkhalil21-svg/American-Rider-Commercial
          ref: ${{ env.CERTIFIED_SHA }}
          path: commercial
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install backend test dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Require submission credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is not configured."; exit 1; }
          test -n "$ASC_API_KEY_BASE64" || { echo "::error::ASC_API_KEY_BASE64 is not configured."; exit 1; }

      - name: Verify certified source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CERTIFIED_SHA" || { echo "::error::Refusing build: $ACTUAL_SHA != $CERTIFIED_SHA"; exit 1; }
          git fetch origin release/current --depth=1
          RELEASE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_SHA" = "$RELEASE_SHA" || { echo "::error::Refusing stale/non-current candidate: $ACTUAL_SHA != release/current $RELEASE_SHA"; exit 1; }
          echo "Certified release/current source verified: $ACTUAL_SHA"

      - name: Verify isolated synthetic journey, money and native wallet source contracts
        run: node scripts/prelaunch-synthetic-acceptance.cjs

      - name: Configure owner-controlled App Store Connect key and select build number
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ar-asc-python"
          "$RUNNER_TEMP/ar-asc-python/bin/python" -m pip install --quiet PyJWT cryptography
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # EAS uses these EXACT names to authenticate with Apple and replace
          # invalid provisioning profiles; submit-only ASC settings are insufficient.
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          # EAS must not request the Apple Team interactively on CI.
          echo "EXPO_APPLE_TEAM_ID=6Z24V6YD4A" >> "$GITHUB_ENV"

          "$RUNNER_TEMP/ar-asc-python/bin/python" - "$KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'PY'
          import base64, json, sys, time, urllib.parse, urllib.request
          key_path, key_id, issuer_id = sys.argv[1:]
          try:
              import jwt
          except ImportError:
              raise SystemExit("PyJWT is required for App Store Connect build discovery")
          with open(key_path, "rb") as fh:
              private_key = fh.read()
          token = jwt.encode(
              {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          q = urllib.parse.urlencode({
              "filter[app]": "6798078543",
              "filter[preReleaseVersion.version]": "1.0.0",
              "filter[preReleaseVersion.platform]": "IOS",
              "fields[builds]": "version",
              "limit": "200",
          })
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/builds?" + q,
                                       headers={"Authorization": "Bearer " + token})
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          nums = [int(x["attributes"]["version"]) for x in data.get("data", [])
                  if str(x.get("attributes", {}).get("version", "")).isdigit()]
          if 58 not in nums:
              raise SystemExit("Apple Build 58 is absent; refusing to skip prior verified TestFlight upload.")
          if 59 in nums or max(nums, default=0) > 59:
              raise SystemExit("Apple already has Build 59 or newer; refusing to reuse build number.")
          next_build = 59
          with open("app.json") as fh:
              app = json.load(fh)
          app.setdefault("expo", {}).setdefault("ios", {})["buildNumber"] = str(next_build)
          with open("app.json", "w") as fh:
              json.dump(app, fh, indent=2); fh.write("\n")
          with open("eas.json") as fh:
              eas = json.load(fh)
          eas.setdefault("cli", {})["appVersionSource"] = "local"
          eas.setdefault("build", {}).setdefault("production", {})["autoIncrement"] = False
          ios = eas.setdefault("submit", {}).setdefault("production", {}).setdefault("ios", {})
          ios.update({"ascApiKeyPath": key_path, "ascApiKeyId": key_id, "ascApiKeyIssuerId": issuer_id})
          with open("eas.json", "w") as fh:
              json.dump(eas, fh, indent=2); fh.write("\n")
          with open("/tmp/next_build_number", "w") as fh:
              fh.write(str(next_build))
          print("Selected next unused iOS build number:", next_build)
          PY

      - name: Verify real live Cloud Run for TestFlight; public App Store SHA parity remains separate
        shell: bash
        run: |
          set -euo pipefail
          # TestFlight can test the candidate before public backend rollout.
          # This keeps all public live/payment/scheduler checks; do NOT
          # describe the binary as cleared for App Store review.
          CERTIFIED_SHA= node scripts/verify-store-cloudrun-api.cjs

      - name: Verify hosted Mac signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          fastlane --version

      - name: Require native associated domains in the exact release source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const app = JSON.parse(fs.readFileSync('app.json','utf8'));
          assert.equal(app.expo.ios.bundleIdentifier,'com.americanrider.app');
          assert.deepEqual(app.expo.ios.associatedDomains,['applinks:americanrider.tech']);
          console.log('Required Apple Universal Links entitlement present in source.');
          NODE
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - name: Build exact Commercial iOS candidate on Mac without cloud build quota
        shell: bash
        run: |
          set -euo pipefail
          export EAS_BUILD_GIT_COMMIT_HASH="$CERTIFIED_SHA"
          export EXPO_PUBLIC_COMMIT="$CERTIFIED_SHA"
          # MapLibre SwiftPM occasionally times out fetching its binary from GitHub.
          # Retry only the same exact source build, never skip signing verification.
          for attempt in 1 2 3; do
            if EXPO_NO_CAPABILITY_SYNC=1 npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/american-rider-commercial.ipa"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::iOS build failed after three identical, safe attempts."
              exit 1
            fi
            echo "::warning::iOS build attempt $attempt failed, retrying same certified SHA after transient dependency/network failure."
            rm -f "$RUNNER_TEMP/american-rider-commercial.ipa"
            sleep 15
          done
          test -s "$RUNNER_TEMP/american-rider-commercial.ipa"
          echo "IOS_IPA_PATH=$RUNNER_TEMP/american-rider-commercial.ipa" >> "$GITHUB_ENV"

      - name: Independently verify the signed IPA contains Universal Links
        shell: bash
        run: |
          set -euo pipefail
          test -s "$IOS_IPA_PATH"
          mkdir -p "$RUNNER_TEMP/ar-signed-ipa"
          unzip -q "$IOS_IPA_PATH" -d "$RUNNER_TEMP/ar-signed-ipa"
          APP="$(find "$RUNNER_TEMP/ar-signed-ipa/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" && test -s "$APP/embedded.mobileprovision"
          codesign --verify "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/ar-signed-entitlements.plist" 2>/dev/null
          security cms -D -i "$APP/embedded.mobileprovision" -o "$RUNNER_TEMP/ar-signed-profile.plist"
          python3 - "$APP/Info.plist" "$RUNNER_TEMP/ar-signed-entitlements.plist" "$RUNNER_TEMP/ar-signed-profile.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: info=plistlib.load(f)
          with open(sys.argv[2],'rb') as f: ent=plistlib.load(f)
          with open(sys.argv[3],'rb') as f: profile=plistlib.load(f)
          assert info.get('CFBundleIdentifier')=='com.americanrider.app','Wrong iOS bundle identifier'
          domains=ent.get('com.apple.developer.associated-domains',[])
          assert 'applinks:americanrider.tech' in domains,'Signed IPA does not contain Universal Links'
          permitted=profile.get('Entitlements',{}).get('com.apple.developer.associated-domains')
          assert permitted and ('*' in permitted or 'applinks:americanrider.tech' in permitted),'Provisioning profile excludes Universal Links'
          app_id=profile.get('Entitlements',{}).get('application-identifier','')
          assert app_id=='6Z24V6YD4A.com.americanrider.app','Provisioning profile belongs to wrong app'
          print('Certified: signed iOS IPA + Apple profile both authorize applinks:americanrider.tech.')
          PY

      - name: Upload verified signed Commercial IPA directly to Apple for TestFlight processing
        shell: bash
        run: |
          set -euo pipefail
          test -s "$IOS_IPA_PATH" || { echo "::error::Signed IPA missing."; exit 1; }
          # Build 57's IPA passed signing but EAS Submit failed DNS on api.expo.dev.
          # Apple's altool is the supported direct uploader using the existing ASC key.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          install -m 600 "$ASC_API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IOS_IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'APPSTORE_UPLOAD_ACCEPTED=BUILD_59' >> "$GITHUB_STEP_SUMMARY"
          echo "Signed Build 59 IPA transmitted to Apple. Processing and TestFlight availability remain independent." >> "$GITHUB_STEP_SUMMARY"
