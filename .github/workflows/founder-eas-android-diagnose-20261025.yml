name: Verify ongoing signed Android EAS cloud build status

on:
  push:
    branches:
      - release/one-time-android-aab-20261025
    paths:
      - .github/workflows/founder-eas-android-diagnose-20261025.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out verified Expo project configuration
        uses: actions/checkout@v4
        with:
          repository: chadkhalil21-svg/American-Rider-Commercial
          ref: 4c3e056cc1335413fc6dc3cfe61183f1c8e43193
          persist-credentials: false

      - name: Install project dependencies for authenticated Expo CLI
        shell: bash
        run: npm ci --ignore-scripts

      - name: Read existing EAS Android build results (no new build)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Existing Expo token unavailable."; exit 1; }
          npx --yes eas-cli@latest build:list --platform android --limit 8 --json > "$RUNNER_TEMP/expo-builds.json"
          node - "$RUNNER_TEMP/expo-builds.json" <<'NODE'
          const fs=require('node:fs');
          const items=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=(Array.isArray(items)?items:(items.builds||[])).map(b=>({
            id:b.id,status:b.status,platform:b.platform,buildProfile:b.buildProfile,
            error:b.error?{errorCode:b.error.errorCode,message:String(b.error.message||'').slice(0,450)}:null,
          }));
          console.log('ANDROID_EAS_BUILDS',JSON.stringify(rows));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Existing Android EAS builds\\n\\n'+
            '```json\\n'+JSON.stringify(rows,null,2)+'\\n```\\n');
          NODE
